<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Security Incident - CyberGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="form-page-body">

<div class="form-container">
    <div class="form-card">
        <div class="form-card-header">
            <div class="header-icon">🚨</div>
            <div>
                <h1>Log New Security Threat</h1>
                <p>Register an incident report into the active threat database</p>
            </div>
        </div>

        <form method="POST" class="incident-form">
            <div class="form-group">
                <label for="threat_type">Threat Vector / Incident Type</label>
                <input type="text"
                       id="threat_type"
                       name="threat_type"
                       placeholder="e.g. Ransomware Activity, DDoS Flood, API Token Leak"
                       required
                       autofocus>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="severity">Severity Classification</label>
                    <select id="severity" name="severity" required>
                        <option value="Critical">Critical (Immediate Hazard)</option>
                        <option value="High" selected>High (Elevated Risk)</option>
                        <option value="Medium">Medium (Moderate Impact)</option>
                        <option value="Low">Low (Informational / Probe)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="status">Initial Status</label>
                    <select id="status" name="status" required>
                        <option value="Open" selected>Open (Needs Triage)</option>
                        <option value="Investigating">Investigating (Under Analysis)</option>
                        <option value="Resolved">Resolved (Contained)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Incident Description & Forensic Details</label>
                <textarea id="description"
                          name="description"
                          rows="4"
                          placeholder="Provide forensic findings, source IP ranges, affected endpoints, or attack indicators..."
                          required></textarea>
            </div>

            <div class="form-actions">
                <a href="/" class="btn btn-secondary">← Back to Dashboard</a>
                <button type="submit" class="btn btn-primary">
                    <span>💾 Commit Threat to Log</span>
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
